upstream frontend {
    server frontend:3001;
}

upstream backend {
    server backend:4000;
}

upstream keycloak {
    server keycloak:8080;
}

server {
    listen 80;
    server_name localhost;

    client_max_body_size 5M;

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # генерация отчёта 360 через LLM: части идут последовательно (Gonka не даёт
        # одновременных запросов), каждая — до 2 попыток по 300 с; для «2 запросов»
        # худший случай 4×300с + запас. «3 запроса» в редчайшем худшем случае
        # (все части с повторами) могут не уложиться — принято осознанно
        proxy_read_timeout 1300s;
    }

    location /auth/ {
        proxy_pass http://keycloak;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location / {
        proxy_pass http://frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
