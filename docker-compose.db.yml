services:
  postgres:
    image: postgres:16-alpine
    container_name: hr-postgres
    environment:
      POSTGRES_USER: hrportal
      POSTGRES_PASSWORD: hrportal
      POSTGRES_DB: hrportal
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrportal"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
